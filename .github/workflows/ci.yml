name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Tests, types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      # R is not installed here, so rpy2 is left out and the GARCH tests skip; the
      # docker job runs GARCH in the image with R.
      - name: Install dependencies
        run: |
          grep -v '^rpy2' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt -r requirements-dev.txt

      - name: Tests (offline)
        run: pytest

      - name: mypy
        run: mypy app tests web/src/runners/python

      - name: flake8
        run: flake8 app tests web/src/runners/python

      - name: black
        run: black --check app tests web/src/runners/python

  web:
    name: Web frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # The build's Brotli copies, so a build compresses only what changed; restored after
      # npm ci, which empties node_modules.
      - uses: actions/cache@v6
        with:
          path: web/node_modules/.cache
          key: web-build-${{ hashFiles('web/package-lock.json') }}-${{ github.sha }}
          restore-keys: web-build-${{ hashFiles('web/package-lock.json') }}-

      # web/openapi.json is checked against the API by the Python tests; here the
      # TypeScript types are checked against it.
      - name: API types are current
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Tests
        run: npm test

      # Offline, as in the Docker build: Pyodide's wheels must be committed in web/vendor.
      - name: Build
        run: npm run build
        env:
          PYODIDE_OFFLINE: "1"

  docker:
    name: Docker image, Postgres, Redis and R
    runs-on: ubuntu-latest
    env:
      PYQXEL_TARGET: app-r
    steps:
      - uses: actions/checkout@v7

      - name: Build the image with R
        run: docker compose build api

      - name: Start the stack
        run: docker compose up -d --wait

      - name: Readiness covers the database, Redis and R
        run: |
          curl -s http://localhost:8000/health/ready | tee ready.json
          python3 -c "import json; checks = json.load(open('ready.json'))['checks']; \
            assert checks == {'database': 'ok', 'redis': 'ok', 'r': 'ok'}, checks"

      - name: GARCH fits in the image
        run: |
          docker compose exec -T api python -c "
          import asyncio
          import numpy as np, pandas as pd
          from app.stats.garch import fit_garch
          returns = np.random.default_rng(7).standard_t(5, 1000) * 0.01
          closes = pd.Series(100 * np.exp(np.cumsum(returns)),
                             index=pd.bdate_range('2022-01-03', periods=1000))
          fit = asyncio.run(fit_garch(closes, 252))
          print(fit.model, fit.observations)
          "

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
