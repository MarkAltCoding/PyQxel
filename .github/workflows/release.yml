name: Release

# Builds the Mac app as a .dmg that runs on Apple silicon and Intel Macs.
#
# Pushing a version tag (git tag v0.2.0 && git push origin v0.2.0) builds it and attaches
# it to a GitHub Release for that tag, made if it does not exist. The tag must match
# "version" in web/src-tauri/tauri.conf.json. Running the workflow by hand (Actions,
# Release, Run workflow) only builds it and keeps it as the run's artifact, to try a
# build without publishing anything.
#
# The app is signed ad hoc, not with an Apple Developer ID, so macOS asks people to
# confirm before its first launch; the README's Install section explains how.
#
# A tagged release also carries the app as a signed update (PyQxel_universal.app.tar.gz)
# and latest.json, which installed apps read to offer "Update and restart"
# (web/src/lib/appUpdates.ts). The update is signed with the key in the
# TAURI_SIGNING_PRIVATE_KEY secret (and its password in TAURI_SIGNING_PRIVATE_KEY_PASSWORD);
# apps accept only updates signed by it, checked against the public key in
# web/src-tauri/tauri.conf.json. Without the secret, the release has the .dmg alone.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    name: Mac .dmg
    runs-on: macos-15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          # Every tag and commit, so the update's notes can list what changed since the
          # last release.
          fetch-depth: 0

      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Rust is on the runner already; the build needs both Mac architectures.
      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            web/src-tauri/target
          key: mac-cargo-${{ hashFiles('web/src-tauri/Cargo.lock') }}
          restore-keys: mac-cargo-

      - run: npm ci

      # Offline, as in CI: Pyodide's wheels are committed in web/vendor. With the signing
      # key, the release configuration also makes the signed update archive.
      - name: Build
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --target universal-apple-darwin --bundles app,dmg \
              --config src-tauri/tauri.release.conf.json
          else
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret, so no update is built; installed apps will not be offered this version."
            npx tauri build --target universal-apple-darwin --bundles dmg
          fi
        env:
          PYODIDE_OFFLINE: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Find the .dmg
        id: dmg
        run: |
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          echo "path=web/$dmg" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$dmg")" >> "$GITHUB_OUTPUT"
          # The bundler removes the .app once it is in the .dmg, so check the one inside.
          mount=$(hdiutil attach -nobrowse -readonly "$dmg" | awk -F'\t' '/\/Volumes\// {print $NF}')
          codesign --verify --deep --strict "$mount/PyQxel.app"
          lipo -archs "$mount/PyQxel.app/Contents/MacOS/pyqxel"
          hdiutil detach "$mount"

      - name: Find the update
        id: update
        run: |
          archive=src-tauri/target/universal-apple-darwin/release/bundle/macos/PyQxel.app.tar.gz
          if [ -f "$archive" ]; then
            cp "$archive" PyQxel_universal.app.tar.gz
            echo "archive=web/PyQxel_universal.app.tar.gz" >> "$GITHUB_OUTPUT"
            echo "signature=$(cat "$archive.sig")" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.dmg.outputs.path }}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.dmg.outputs.path }}" \
              --title "PyQxel ${GITHUB_REF_NAME#v}" --generate-notes
          fi

      # latest.json names the version, its notes, and where its signed update is, for both
      # Mac architectures (the app is universal). Apps read it from the latest release.
      - name: Attach the update
        if: startsWith(github.ref, 'refs/tags/') && steps.update.outputs.archive != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNATURE: ${{ steps.update.outputs.signature }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "${{ steps.update.outputs.archive }}" --clobber
          # The app shows these: what changed since the last release, by commit subject
          # (without the "Release x.y.z" commits the release script makes).
          previous="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          git log --no-merges --format='%s' ${previous:+"$previous.."}"$GITHUB_REF_NAME" \
            | grep -v '^Release [0-9]' | head -20 > notes.txt
          python3 - <<'PY'
          import datetime, json, os
          tag = os.environ["GITHUB_REF_NAME"]
          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/PyQxel_universal.app.tar.gz"
          target = {"signature": os.environ["SIGNATURE"], "url": url}
          json.dump({
              "version": tag.removeprefix("v"),
              "notes": open("notes.txt").read().strip()[:2000],
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {"darwin-aarch64": target, "darwin-x86_64": target},
          }, open("latest.json", "w"), indent=2)
          PY
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
