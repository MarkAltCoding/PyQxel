# Builds the image with R on Cloud Build and pushes it to Artifact Registry.
# deploy/cloud-run.sh runs this with _IMAGE set; see "Google Cloud Run" in README.md.

steps:
  - name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "--target", "app-r", "--tag", "${_IMAGE}", "."]

images: ["${_IMAGE}"]

# Compiling rugarch takes a few minutes on the default (free-tier) machine.
timeout: 3600s
