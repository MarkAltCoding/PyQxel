# Builds the image on Cloud Build and pushes it to Artifact Registry.
# deploy/cloud-run.sh runs this with _IMAGE set; see docs/setup.md.

steps:
  - name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "--tag", "${_IMAGE}", "."]

images: ["${_IMAGE}"]

timeout: 1800s
