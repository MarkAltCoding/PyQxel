<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The master for `npx tauri icon src-tauri/app-icon.svg` with the iOS color set to #2a78d6: macOS's
       824px rounded square on a 1024px canvas. The body is one flat color, the iOS
       background, so the iOS icon (filled out to the corners) shows no edge. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#2a78d6"/>
  <g stroke="#fff" stroke-opacity="0.2" stroke-width="10" stroke-linecap="round">
    <path d="M240 420H784M240 560H784M240 700H784"/>
  </g>
  <path d="M250 690L430 500L580 610L770 370" fill="none" stroke="#fff" stroke-width="72"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="770" cy="370" r="62" fill="#fff"/>
  <circle cx="770" cy="370" r="26" fill="#2a78d6"/>
</svg>
